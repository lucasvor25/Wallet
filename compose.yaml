services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '127.0.0.1:${DATABASE_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: npm run migration:run:prod
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      # Fixo: pino-pretty é devDependency e não existe na imagem.
      LOG_PRETTY: 'false'
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health/live || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      seed:
        condition: service_completed_successfully

  # Roda a cada up; só cria dados se SEED_DEMO=true e NODE_ENV != production (senão sai com 0).
  seed:
    build: .
    command: node dist/database/seeds/seed.js
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      LOG_PRETTY: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
